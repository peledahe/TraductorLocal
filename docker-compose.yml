services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate_backend
    restart: always
    environment:
      - LT_LOAD_ONLY=en,es,fr,de,it,pt,ru,zh,ja,ko,ar,hi,nl,ca
      - LT_UPDATE_MODELS=true
      - LT_DISABLE_WEB_UI=false
    volumes:
      - ./data/libretranslate:/home/libretranslate/.local
      - libretranslate_temp:/tmp/libretranslate-files-translate
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/languages\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  traductor-web:
    image: python:3.12-alpine
    container_name: traductor_local_ui
    restart: always
    working_dir: /app
    volumes:
      - .:/app
      - libretranslate_temp:/tmp/libretranslate-files-translate
    environment:
      - PORT=8080
      - SSL_PORT=8443
      - LIBRETRANSLATE_HOST=http://libretranslate:5000
    ports:
      - "80:8080"
      - "443:8443"
      - "8080:8080"
    command: ["python3", "server.py"]
    depends_on:
      - libretranslate

volumes:
  libretranslate_temp:
